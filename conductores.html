<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LogiTrans Express - Conductores</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="modulo-container">
        <a href="index.html" class="btn-back">⬅ Volver al Menú Principal</a>

        <h2>Gestión de Conductores</h2>

        <div class="container-formulario-modulo">
            
            <div class="columna-datos">
                <h3 id="form-title">Registrar Conductor</h3>
                <form id="formConductor">  
                    <div class="form-grid">
                        <div class="form-group">
                            <input type="text" id="nombres" name="nombres" placeholder="Nombres" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <input type="text" id="apellidos" name="apellidos" placeholder="Apellidos" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <input type="text" id="documento" name="documento" placeholder="Documento de Identificación" required autocomplete="off">
                            <span id="msgInputDoc" class="error-input-msg">El documento es requerido</span>
                        </div>
                        <div class="form-group">
                            <input type="text" id="telefono" name="telefono" placeholder="Teléfono" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <input type="email" id="correo" name="correo" placeholder="Correo Electrónico" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <input type="text" id="numero_licencia" name="num_licencia" placeholder="Número de Licencia" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <input type="text" id="categoria_licencia" name="categoria" placeholder="Categoría de Licencia (Ej: C2, C3)" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label>Vencimiento Licencia:</label>
                            <input type="date" id="fecha_vencimiento_licencia" name="fecha_vencimiento" required>
                        </div>
                        <div class="form-group hidden" id="form-group-estado">
                            <select id="estado" name="estado">
                                <option value="disponible">Disponible</option>
                                <option value="en_ruta">En ruta</option>
                                <option value="inactivo">Inactivo</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar Conductor</button>
                        <button type="button"class="btn btn-secondary hidden"id="btnCancelar">Cancelar</button>
                    </div>
                </form>
            </div>

            <div class="columna-imagen">
                <img src="Recursos/conductor.jpg" alt="Conductor">
            </div>

        </div>

        <div class="tabla-container">
            <h3>Conductores Registrados</h3>
            <table id="conductoresTB" class="tabla-datos">
                <thead>
                    <tr>
                        <th>Identificación</th>
                        <th>Nombre Completo</th>
                        <th>Licencia (Cat - Vence)</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </div>

    <div id="modal1" class="modal-overlay close">
        <div class="modal-content">
            <p></p> 
            <button type="button" class="btn-modal-close">Aceptar</button>
        </div>
    </div>

    <script src="js/modal.js"></script>
    <script src="js/conductores.js"></script> 
</body>
</html>
