<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LogiTrans Express - Gestión de Rutas</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="modulo-container">
        
        <div class="navigation-bar">
            <a href="index.html" class="btn-back">← Volver al Menú</a>
        </div>

        <h2>Módulo de Gestión de Rutas</h2>

        <div class="container-formulario-modulo">
            
            <div class="columna-datos">
                <h3 id="form-title">Registrar Nueva Ruta</h3>
                
                <form id="formRuta">
                    <input type="hidden" id="rutaId">

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="origen">Ciudad de Origen</label>
                            <input type="text" id="origen" placeholder="Ej: Cali" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="destino">Ciudad de Destino</label>
                            <input type="text" id="destino" placeholder="Ej: Bogotá" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="distancia">Distancia (Kilómetros)</label>
                            <input type="number" id="distancia" placeholder="Ej: 450" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="tiempo_estimado">Tiempo Estimado (Horas)</label>
                            <input type="number" step="0.5" id="tiempo_estimado" placeholder="Ej: 9.5" required autocomplete="off">
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button class="btn btn-primary" type="submit" id="btnGuardar">Guardar Ruta</button>
                        <button class="btn btn-secondary hidden" type="button" id="btnCancelar">Cancelar Edición</button>
                    </div>
                </form>
            </div>
            
            <div class="tabla-container">
                <h3>Rutas Disponibles</h3>
                <table class="tabla-datos" id="rutasTB">
                    <thead>
                        <tr>
                            <th>Origen</th>
                            <th>Destino</th>
                            <th>Distancia</th>
                            <th>Tiempo Estimado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>

        </div>
    </div>

    <div id="modal1" class="modal-overlay close">
        <div class="modal-content">
            <p></p> 
            <button type="button" class="btn-modal-close">Aceptar</button>
        </div>
    </div>

    <script src="js/modal.js"></script>
     <script src="js/dashboard.js"></script>
    <script src="js/rutas.js"></script>
</body>
</html>
