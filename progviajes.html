<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LogiTrans Express - Programación de Viajes</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="modulo-container">
        
        <div class="navigation-bar">
            <a href="index.html" class="btn-back">← Volver al Menú</a>
        </div>

        <h2>Módulo de Programación de Viajes</h2>

        <div class="container-formulario-modulo">
            
            <div class="columna-datos">
                <h3 id="form-title">Programar Itinerario</h3>
                
                <form id="formViaje">
                    <div class="form-grid">
                        
                        <div class="form-group">
                            <label for="selectConductor">Conductor Asignado</label>
                            <select id="selectConductor" required>
                                <option value="">Cargando conductores...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="selectVehiculo">Vehículo / Camión</label>
                            <select id="selectVehiculo" required>
                                <option value="">Cargando vehículos...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="selectRuta">Ruta de Viaje</label>
                            <select id="selectRuta" required>
                                <option value="">Cargando rutas...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="fecha_salida">Fecha de Salida</label>
                            <input type="date" id="fecha_salida" required>
                        </div>

                        <div class="form-group">
                            <label for="hora_salida">Hora de Salida</label>
                            <input type="time" id="hora_salida" required>
                        </div>

                        <div class="form-group">
                            <label for="fecha_estimada_llegada">Fecha Estimada Llegada</label>
                            <input type="date" id="fecha_estimada_llegada" required>
                        </div>

                        <div class="form-group">
                            <label for="observaciones">Observaciones</label>
                            <input type="text" id="observaciones" placeholder="Ej: Carga de alimentos" required>
                        </div>


                    </div>
                    <div class="form-actions">
                        <button class="btn btn-primary" type="submit" id="btnGuardar">Guardar Viaje</button>
                        <button class="btn btn-secondary hidden" type="button" id="btnCancelar">Cancelar Edición</button>
                    </div>
                </form>
            </div>
            <div class="tabla-container">
                <h3>Historial de Itinerarios</h3>
                <table class="tabla-datos" id="viajesTB">
                    <thead>
                        <tr>
                            <th>Salida</th>
                            <th>Conductor</th>
                            <th>Vehículo</th>
                            <th>Observaciones</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>

        </div>
    </div>
    <div id="modal1" class="modal-overlay close">
        <div class="modal-content">
            <p></p> 
            <button type="button" class="btn-modal-close">Aceptar</button>
        </div>
    </div>

    <script src="js/modal.js"></script>
    <script src="js/progviaje.js"></script>
</body>
</html>
